[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injector-autowired"
version = "1.0.0"
description = "Spring-Boot-style autowiring (component scanning) for the Python injector library."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Tyler R. Suehr", email = "tylersuehr7@yahoo.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "dependency-injection",
    "injector",
    "autowire",
    "component-scan",
    "spring",
]
dependencies = ["injector>=0.21"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/tylersuehr7/python-injector-autowired"
Repository = "https://github.com/tylersuehr7/python-injector-autowired"
Issues = "https://github.com/tylersuehr7/python-injector-autowired/issues"
Changelog = "https://github.com/tylersuehr7/python-injector-autowired/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/injector_autowired"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# injector ships without complete type stubs.
module = ["injector"]
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# PEP 695 generic syntax is used deliberately; keep TypeVar where it reads better.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Tests define throwaway classes and reuse names across cases.
"tests/**/*.py" = ["E402", "F811"]

[tool.coverage.run]
source = ["src/injector_autowired"]
